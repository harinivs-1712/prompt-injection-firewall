[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
timeout = 120
timeout_method = thread
faulthandler_timeout = 100
markers =
    integration: uses the real frozen Layer 1 scanner and local model/cache
    slow: loads local model assets and can take longer than the offline unit tests
    timeout: per-test timeout marker provided by pytest-timeout when installed
