[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-injection-firewall"
version = "0.1.0"
description = "Agent-agnostic policy firewall with optional prompt-injection scanning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
layer1 = [
  "nltk>=3.8.1",
  "spacy>=3.7.0,<4",
  "transformers>=4.44.0",
  "torch>=2.2.0",
  "google-genai>=1.0.0",
]
dev = ["pytest>=8.0.0", "pytest-timeout>=2.3.1"]
eval = ["matplotlib>=3.8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["firewall*", "layers*"]
